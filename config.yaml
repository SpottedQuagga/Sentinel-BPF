# SentinelBPF Configuration File

server:
  host: "127.0.0.1"
  port: 8080
  # Optional bearer token for API and WebSocket authentication.
  # If empty, authentication is disabled.
  auth_token: ""
  # Allowed CORS & WebSocket origins
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

bpf:
  # Size of the BPF ring buffer in bytes. Must be a power of 2.
  # 16777216 = 16 MB
  ring_buffer_size: 16777216
  # Capacity of the user-space internal event channel.
  event_buffer_size: 65536

rules:
  # When set to true, connections to 127.0.0.1 are treated as external for testing.
  # Keep false in production.
  treat_loopback_as_external: false
  # Cooldown period (in seconds) to suppress duplicate alerts for (rule, pid, key).
  alert_cooldown_seconds: 10

  reverse_shell:
    enabled: true
    connection_timeout_seconds: 30
    shell_binaries:
      - "/bin/sh"
      - "/bin/bash"
      - "/bin/zsh"
      - "/bin/dash"
      - "/usr/bin/sh"
      - "/usr/bin/bash"
      - "/usr/bin/python"
      - "/usr/bin/python3"
      - "/usr/bin/perl"
      - "/usr/bin/ruby"
      - "/bin/nc"
      - "/usr/bin/nc"
      - "/bin/socat"
      - "/usr/bin/socat"

  privilege_escalation:
    enabled: true
    monitor_setuid_binaries: true

  file_tampering:
    enabled: true
    sensitive_paths:
      - "/etc/passwd"
      - "/etc/shadow"
      - "/etc/sudoers"
      - "/etc/ld.so.preload"
      - "/etc/pam.d"
      - "/etc/crontab"
    allowlisted_binaries:
      - "/usr/bin/passwd"
      - "/usr/sbin/useradd"
      - "/usr/sbin/usermod"
      - "/usr/sbin/vipw"
      - "/usr/bin/chsh"
      - "/usr/bin/gpasswd"

  process_injection:
    enabled: true

  unauthorized_mount:
    enabled: true

logging:
  level: "info"
  format: "text"
